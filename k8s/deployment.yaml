apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-support-chatbot
  labels:
    app: it-support-chatbot
spec:
  # Single replica: each pod builds its own in-memory Chroma index and holds
  # chat history in an InMemorySaver, so replicas do not share state. Scaling
  # past 1 needs an external vector store and checkpointer first.
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: it-support-chatbot
  template:
    metadata:
      labels:
        app: it-support-chatbot
    spec:
      containers:
        # Container name must stay "chatbot" — the deploy workflow targets it
        # by name in rollout/status checks.
        - name: chatbot
          # Placeholder token only. CI renders this to the immutable image ref
          # built by that run before applying the manifest.
          image: PIPELINE_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          # AWS credentials come from the secret the deploy workflow syncs on
          # every run — supplies the three vars config.py validates at startup.
          envFrom:
            - secretRef:
                name: aws-credentials
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Streamlit's health endpoint. Startup probe covers the slow first
          # boot (Bedrock embedding of the knowledge base) and allows up to
          # 2.5 minutes before the liveness probe starts enforcing.
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
