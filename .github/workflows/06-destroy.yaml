name: Destroy EKS App & Cluster

on:
  workflow_dispatch:
    inputs:
      destroy_application:
        description: 'Delete Kubernetes app resources before cluster destroy'
        required: true
        default: true
        type: boolean
      destroy_cluster:
        description: 'Destroy the EKS Terraform stack'
        required: true
        default: true
        type: boolean
      delete_namespace:
        description: 'Delete the it-support namespace after app teardown'
        required: true
        default: true
        type: boolean

concurrency:
  group: terraform-eks-state
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: ness-itbot-eks
  STATE_BUCKET: ness-itbot-tfstate
  LOCK_TABLE: ness-itbot-tflock
  STATE_KEY: eks/terraform.tfstate
  TF_VERSION: 1.9.8
  TF_LOCK_TIMEOUT: 10m
  TF_DIR: terraform/03-eks
  K8S_DIR: k8s
  K8S_NAMESPACE: it-support
  K8S_SERVICE: it-support-chatbot
  K8S_NODEPORT_SERVICE: it-support-chatbot-nodeport

jobs:
  teardown_app:
    runs-on: ubuntu-latest
    if: inputs.destroy_application
    outputs:
      cluster_exists: ${{ steps.cluster.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      # Keep within one minor version of kubernetes_version in Terraform.
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect cluster
        id: cluster
        run: |
          if aws eks describe-cluster --name "$EKS_CLUSTER" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Cluster '$EKS_CLUSTER' not found; skipping Kubernetes teardown."
          fi

      - name: Write kubeconfig
        if: steps.cluster.outputs.exists == 'true'
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      # Delete the manifest set first so any LoadBalancer service can release its
      # AWS resources before Terraform starts deleting cluster infrastructure.
      - name: Delete app manifests
        if: steps.cluster.outputs.exists == 'true'
        run: kubectl delete -n "$K8S_NAMESPACE" -f "$K8S_DIR/" --ignore-not-found=true

      - name: Delete synced secret
        if: steps.cluster.outputs.exists == 'true'
        run: kubectl delete secret aws-credentials -n "$K8S_NAMESPACE" --ignore-not-found=true

      - name: Wait for Services to disappear
        if: steps.cluster.outputs.exists == 'true'
        run: |
          kubectl wait --for=delete "service/$K8S_SERVICE" \
            -n "$K8S_NAMESPACE" --timeout=5m || true
          kubectl wait --for=delete "service/$K8S_NODEPORT_SERVICE" \
            -n "$K8S_NAMESPACE" --timeout=2m || true

      - name: Delete namespace
        if: steps.cluster.outputs.exists == 'true' && inputs.delete_namespace
        run: kubectl delete namespace "$K8S_NAMESPACE" --ignore-not-found=true --timeout=5m || true

      - name: Teardown summary
        if: always()
        run: |
          {
            echo "### App teardown"
            if [ "${{ steps.cluster.outputs.exists }}" != "true" ]; then
              echo "Cluster not found. Kubernetes teardown skipped."
            else
              echo "- Namespace: \`$K8S_NAMESPACE\`"
              echo "- Manifests deleted from: \`$K8S_DIR/\`"
              echo '```'
              kubectl get all,secret -n "$K8S_NAMESPACE" 2>&1 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  plan_destroy:
    runs-on: ubuntu-latest
    needs: teardown_app
    if: |
      always() &&
      inputs.destroy_cluster &&
      (needs.teardown_app.result == 'success' || needs.teardown_app.result == 'skipped')
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform validate
        run: terraform validate

      - name: Terraform destroy plan
        run: terraform plan -destroy -out=tfplan -input=false -lock-timeout=${TF_LOCK_TIMEOUT}

      - name: Stage plan for destroy
        run: cp .terraform.lock.hcl tfplan.lock.hcl

      - name: Plan summary
        run: |
          echo '### Terraform destroy plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan | head -200 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tf-destroy-plan
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/tfplan.lock.hcl
          retention-days: 5

  destroy_cluster:
    runs-on: ubuntu-latest
    needs: plan_destroy
    if: inputs.destroy_cluster
    environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tf-destroy-plan
          path: ${{ env.TF_DIR }}

      - name: Restore provider lock from plan
        run: mv tfplan.lock.hcl .terraform.lock.hcl

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform destroy
        run: terraform apply -input=false -auto-approve -lock-timeout=${TF_LOCK_TIMEOUT} tfplan

      - name: Destroy summary
        run: |
          {
            echo "### Cluster destroy"
            echo "Terraform state key: \`${STATE_KEY}\`"
            echo '```'
            terraform state list 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"