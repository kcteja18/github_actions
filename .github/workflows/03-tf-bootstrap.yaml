# Run ONCE before 04-infra-eks.yaml.
# Creates the S3 bucket + DynamoDB table that hold Terraform remote state.
# This cannot live in Terraform itself: the backend must exist before `terraform init`.
name: TF Bootstrap (run once)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "bootstrap" to confirm creating state resources'
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  STATE_BUCKET: ness-itbot-tfstate
  LOCK_TABLE: ness-itbot-tflock

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against accidental runs
        if: inputs.confirm != 'bootstrap'
        run: |
          echo "::error::Confirmation text did not match. Type 'bootstrap' to proceed."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # us-east-1 rejects LocationConstraint; every other region requires it.
      - name: Create state bucket (idempotent)
        run: |
          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "Bucket $STATE_BUCKET already exists — skipping create."
          elif [ "$AWS_REGION" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
          else
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi

      - name: Harden state bucket
        run: |
          aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
            --public-access-block-configuration \
            'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'

      - name: Create lock table (idempotent)
        run: |
          if aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Table $LOCK_TABLE already exists — skipping create."
          else
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"
            aws dynamodb wait table-exists --table-name "$LOCK_TABLE" --region "$AWS_REGION"
          fi

      - name: Summary
        run: |
          {
            echo "### Terraform backend ready"
            echo "- Bucket: \`$STATE_BUCKET\` (versioned, encrypted, private)"
            echo "- Lock table: \`$LOCK_TABLE\`"
            echo "- Region: \`$AWS_REGION\`"
          } >> "$GITHUB_STEP_SUMMARY"
