# Build the app image, push to Docker Hub, publish a source artifact, then
# roll it out to EKS. Assumes the cluster already exists (04-infra-eks.yaml).
name: Build & Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (blank = short commit SHA)'
        required: false
        type: string
      deploy:
        description: 'Deploy to EKS after building'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: ness-itbot-eks
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/it-support-chatbot
  K8S_DIR: k8s
  K8S_NAMESPACE: it-support
  K8S_DEPLOYMENT: it-support-chatbot
  K8S_CONTAINER: chatbot

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Immutable SHA tag is what gets deployed; :latest is a convenience
      # pointer only. Never deploy by :latest — it makes rollbacks ambiguous.
      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=${DOCKERHUB_REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ${DOCKERHUB_REPO}:${TAG}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Import check only. verify.py needs live AWS Bedrock credentials, so it
      # cannot run here — see the notes in the PR description.
      - name: Sanity check imports
        run: python -c "import ast,sys;[ast.parse(open(f).read()) for f in ['app.py','bot.py','chain.py','config.py','ingest.py','prompts.py']];print('syntax OK')"

      - name: Build source artifact
        run: |
          mkdir -p dist
          cp *.py requirements.txt readme.md dockerfile it_sector.txt dist/
          if [ -d "$K8S_DIR" ]; then cp -r "$K8S_DIR" dist/; fi

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ steps.meta.outputs.tag }}
          path: dist
          retention-days: 30

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ env.DOCKERHUB_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          {
            echo "### Image pushed"
            echo "- \`${{ steps.meta.outputs.ref }}\`"
            echo "- \`${DOCKERHUB_REPO}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: inputs.deploy
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Pinned explicitly rather than relying on the runner image shipping
      # kubectl — that is not a guaranteed tool and has been removed before.
      # Keep within one minor version of K8S_VERSION in terraform.
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify cluster is reachable
        run: |
          if ! aws eks describe-cluster --name "$EKS_CLUSTER" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "::error::Cluster '$EKS_CLUSTER' not found. Run 04-infra-eks.yaml with action=apply first."
            exit 1
          fi

      - name: Write kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Ensure namespace
        run: |
          kubectl create namespace "$K8S_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      # The app reads AWS creds from env (config.py). Recreating the secret each
      # run keeps it in sync with repo secrets without ever committing values.
      - name: Sync app secrets
        run: |
          kubectl create secret generic aws-credentials \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
            --from-literal=AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
            --from-literal=AWS_DEFAULT_REGION="$AWS_REGION" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Render the Deployment with the immutable image built by this run before
      # applying the manifest set. This keeps the live spec aligned with what
      # CI actually shipped instead of applying a placeholder then mutating it.
      - name: Render manifests for this build
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          if [ -z "$IMAGE_TAG" ]; then
            echo "::error::Build output 'image_tag' is empty."
            exit 1
          fi

          IMAGE_REF="${DOCKERHUB_REPO}:${IMAGE_TAG}"
          RENDER_DIR="$(mktemp -d)"
          cp -R "$K8S_DIR"/. "$RENDER_DIR"/
          sed "s|PIPELINE_IMAGE|$IMAGE_REF|" \
            "$K8S_DIR/deployment.yaml" > "$RENDER_DIR/deployment.yaml"
          if grep -q 'PIPELINE_IMAGE' "$RENDER_DIR/deployment.yaml"; then
            echo '::error::Image placeholder was not rendered in deployment.yaml.'
            exit 1
          fi
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          echo "RENDER_DIR=$RENDER_DIR" >> "$GITHUB_ENV"

      # Non-recursive: only top-level manifests in k8s/ are applied.
      - name: Apply manifests
        run: kubectl apply -n "$K8S_NAMESPACE" -f "$RENDER_DIR/"

      - name: Wait for rollout
        id: rollout
        run: |
          kubectl rollout status -n "$K8S_NAMESPACE" \
            "deployment/$K8S_DEPLOYMENT" --timeout=5m

      - name: Roll back on failure
        if: failure() && steps.rollout.outcome == 'failure'
        run: |
          echo "::warning::Rollout failed — reverting to previous revision."
          kubectl rollout undo -n "$K8S_NAMESPACE" "deployment/$K8S_DEPLOYMENT"
          kubectl rollout status -n "$K8S_NAMESPACE" \
            "deployment/$K8S_DEPLOYMENT" --timeout=5m

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo "Image: \`${IMAGE_REF:-$DOCKERHUB_REPO:${{ needs.build.outputs.image_tag }}}\`"
            echo '```'
            kubectl get pods,svc -n "$K8S_NAMESPACE" -o wide 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
