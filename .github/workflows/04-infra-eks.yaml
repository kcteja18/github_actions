# Provisions the EKS cluster with Terraform. Run 03-tf-bootstrap.yaml first.
# plan and apply are separate jobs so the apply can sit behind an environment
# approval gate — infra changes should never be a one-click accident.
name: Infra - EKS (Terraform)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

concurrency:
  group: terraform-eks-state
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  STATE_BUCKET: ness-itbot-tfstate
  LOCK_TABLE: ness-itbot-tflock
  STATE_KEY: eks/terraform.tfstate
  TF_VERSION: 1.9.8
  TF_LOCK_TIMEOUT: 10m
  TF_DIR: terraform/03-eks

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Backend is configured here rather than hardcoded in terraform/backend.tf
      # so the same code can target different state buckets per environment.
      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan -input=false -lock-timeout=${TF_LOCK_TIMEOUT}
          else
            terraform plan -out=tfplan -input=false -lock-timeout=${TF_LOCK_TIMEOUT}
          fi

      # A saved plan is only valid against the exact provider versions it was
      # created with. Shipping the lock file alongside it lets the apply job
      # init to identical versions instead of re-resolving.
      - name: Stage plan for apply
        run: cp .terraform.lock.hcl tfplan.lock.hcl

      - name: Plan summary
        run: |
          echo '### Terraform plan (`${{ inputs.action }}`)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan | head -200 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The saved plan is what apply consumes — guarantees apply does exactly
      # what was reviewed, with no drift between the two jobs.
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/tfplan.lock.hcl
          retention-days: 5

  apply:
    runs-on: ubuntu-latest
    needs: plan
    if: inputs.action == 'apply' || inputs.action == 'destroy'
    # Configure required reviewers on this environment in repo Settings →
    # Environments to make apply a gated, human-approved step.
    environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Download BEFORE init: the plan ships the lock file it was built with, and
      # init must install exactly those provider versions or `terraform apply
      # tfplan` rejects the plan as stale.
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Restore provider lock from plan
        run: mv tfplan.lock.hcl .terraform.lock.hcl

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -lock-timeout=${TF_LOCK_TIMEOUT} tfplan

      - name: Output cluster details
        run: |
          {
            echo "### EKS cluster"
            echo '```'
            terraform output -no-color || echo "(no outputs defined)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
